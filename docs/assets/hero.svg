      <circle cx="0" cy="54" r="10"/><circle cx="48" cy="54" r="10"/><circle cx="96" cy="54" r="10"/><circle cx="144" cy="54" r="10"/>
      <circle cx="0" cy="108" r="10"/><circle cx="48" cy="108" r="10"/><circle cx="96" cy="108" r="10"/><circle cx="144" cy="108" r="10"/>
      <circle cx="0" cy="162" r="10"/><circle cx="48" cy="162" r="10"/><circle cx="96" cy="162" r="10"/><circle cx="144" cy="162" r="10"/>
    </g>
    <g stroke="#77b4ff" stroke-width="4" stroke-linecap="round">
      <path d="M0 0H144"/><path d="M0 54H96"/><path d="M48 108H144"/><path d="M0 162H48"/>
    </g>
    <g fill="#77b4ff">
      <circle cx="0" cy="0" r="10"/><circle cx="48" cy="0" r="10"/><circle cx="96" cy="0" r="10"/><circle cx="144" cy="0" r="10"/>
      <circle cx="0" cy="54" r="10"/><circle cx="96" cy="54" r="10"/>
      <circle cx="48" cy="108" r="10"/><circle cx="144" cy="108" r="10"/>
      <circle cx="0" cy="162" r="10"/><circle cx="48" cy="162" r="10"/>
