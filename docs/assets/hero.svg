    <g fill="#77b4ff">
      <rect x="185" y="-12" width="136" height="24" rx="3"/>
      <rect x="185" y="42" width="103" height="24" rx="3" opacity="0.8"/>
      <rect x="185" y="96" width="69" height="24" rx="3" opacity="0.65"/>
      <rect x="185" y="150" width="38" height="24" rx="3" opacity="0.5"/>
