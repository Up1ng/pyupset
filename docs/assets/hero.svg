<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">PyUpSet</title>
  <desc id="desc">See where your data overlaps. Set intersection visualization for Python.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c1c34"/>
      <stop offset="1" stop-color="#153e70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="83" fill="#81b9ff" font-size="24" font-weight="700" letter-spacing="4">PYUPSET</text>
    <text x="64" y="155" fill="#fff" font-size="48" font-weight="700">See where your</text>
    <text x="64" y="211" fill="#fff" font-size="48" font-weight="700">data overlaps.</text>
    <text x="66" y="275" fill="#bed1e9" font-size="20">Your DataFrame. One clear picture.</text>
  </g>
  <g transform="translate(775 76)">
