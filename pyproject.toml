[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyupset"
version = "0.1.0"
description = "UpSet set intersection visualization directly from pandas DataFrames with matplotlib"
keywords = ["upset", "data-visualization", "pandas", "matplotlib", "set-intersection"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/Up1ng/pyupset"
Documentation = "https://github.com/Up1ng/pyupset/blob/main/docs/guide.md"
Repository = "https://github.com/Up1ng/pyupset"
Issues = "https://github.com/Up1ng/pyupset/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8", "black>=24", "pandas-stubs>=2", "build>=1"]
notebook = ["jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyupset = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.black]
target-version = ["py310"]
